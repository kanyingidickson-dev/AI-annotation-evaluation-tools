[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-annotation-evaluation-tools"
version = "1.0.0"
description = "Enterprise-grade toolkit for AI dataset annotation, evaluation, and RAG optimization."
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "openai>=1.0.0",
    "langchain>=0.1.0",
    "langchain-openai",
    "langchain-anthropic",
    "anthropic",
    "scikit-learn",
    "numpy",
    "pydantic>=2.0.0",
    "tenacity>=8.0.0",
    "python-dotenv"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "isort",
    "mypy"
]

[tool.setuptools.packages.find]
where = ["src"]
